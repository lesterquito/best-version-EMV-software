<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — X2 Smartcard Allinone</title>
  <meta name="description" content="Contact X2 Smartcard Allinone.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="X2 Smartcard Allinone">
      </a>
      <nav class="nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="software.html">Software</a>
        <a href="hardware.html">Hardware</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <p class="eyebrow">Support</p>
      <h1>Contact</h1>
      <p class="lead">Send a message.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <form class="contact-form" action="#" method="post" onsubmit="return handleSubmit(event)">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="reason">Reason for Contact</label>
          <select id="reason" name="reason" required>
            <option value="" disabled selected>Select a reason</option>
            <option value="general">General enquiry</option>
            <option value="content">Content suggestion</option>
            <option value="technical">Technical feedback</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <nav class="footer-nav">
          <a href="index.html">Home</a>
          <a href="software.html">Software</a>
          <a href="hardware.html">Hardware</a>
          <a href="products.html">Products</a>
          <a href="faq.html">FAQ</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
        <p class="footer-copy">© 2026 X2 Smartcard Allinone. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script src="js/main.js"></script>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      alert("Thank you. This is a demonstration form. In a production environment your message would be sent to the site administrator.");
      e.target.reset();
      return false;
    }
  </script>
</body>
</html>
