<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Aether Study</title>
  <meta name="description" content="Get in touch regarding this educational resource.">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Header logo styling (same as index) */
    .logo img {
      height: 22px;
      width: auto;
      display: block;
      transition: opacity 0.2s ease;
    }
    .logo:hover img {
      opacity: 0.85;
    }

    /* Center the footer */
    .footer .footer-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .footer .footer-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/X2 SmartCard Allinone LOGO.png" alt="X2 Smartcard Allinone">
      </a>
      <nav class="nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="software.html">Software</a>
        <a href="hardware.html">Hardware</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1>Contact</h1>
      <p class="lead">
        Send a message.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <form class="contact-form" action="#" method="post" onsubmit="return handleSubmit(event)">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="reason">Reason for Contact</label>
          <select id="reason" name="reason" required>
            <option value="" disabled selected>Select a reason</option>
            <option value="general">General enquiry</option>
            <option value="content">Content suggestion</option>
            <option value="technical">Technical feedback</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <nav class="footer-nav">
          <a href="index.html">Home</a>
          <a href="software.html">Software</a>
          <a href="hardware.html">Hardware</a>
          <a href="products.html">Products</a>
          <a href="faq.html">FAQ</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      alert('Thank you. This is a demonstration form. In a production environment your message would be sent to the site administrator.');
      e.target.reset();
      return false;
    }
  </script>
</body>
</html>
